name: Verify U.S. update PR permission (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create and close a draft permission-check PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$GITHUB_REF_NAME" --draft --title '[TEST ONLY] Verify Actions PR permission — do not merge' --body 'Temporary permission check; this PR changes the workflow only for verification and must not be merged.')
          echo "Created draft PR: $url"
          gh pr close "$url" --repo "$GITHUB_REPOSITORY"
          echo "Closed draft permission-check PR."
