name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..15}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false)] | length")
            if [[ "$count" == 1 ]]; then
              exit 0
            fi
            sleep 2
          done
          echo '::error::Uploaded Pages artifact did not become available.'
          exit 1
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
